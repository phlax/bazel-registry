matrix:
  platform:
  - ubuntu2004
  - macos
  - windows
  bazel:
  - 9.x
tasks:
  verify_targets:
    name: Verify build targets
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_targets:
    - '@googleurl//url:url'
    build_flags:
    - '--cxxopt=-std=c++14'
    - '--cxxopt=-fno-strict-aliasing'
